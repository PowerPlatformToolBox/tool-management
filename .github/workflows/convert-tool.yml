name: Convert and Publish Tool
run-name: Convert intake ${{ inputs.request_id }}

concurrency:
    group: convert-tool-${{ inputs.npm_package_name }}
    cancel-in-progress: false

on:
    workflow_dispatch:
        inputs:
            npm_package_name:
                description: "npm package name"
                required: true
                type: string
            display_name:
                description: "Tool display name"
                required: true
                type: string
            description:
                description: "Tool description"
                required: true
                type: string
            icon:
                description: "Icon path (bundled SVG under dist)"
                required: false
                type: string
            readme_url:
                description: "README URL"
                required: false
                type: string
            version:
                description: "Exact approved npm version"
                required: true
                type: string
            intake_id:
                description: "Approved intake ID"
                required: true
                type: string
            intake_revision:
                description: "Revision of the approved intake"
                required: true
                type: string
            request_id:
                description: "Web conversion request ID"
                required: true
                type: string
            license:
                description: "License"
                required: false
                type: string
            csp_exceptions:
                description: "CSP Exceptions"
                required: false
                type: string
            submitted_by:
                description: "Submitted by"
                required: false
                type: string
            features:
                description: "Features"
                required: false
                type: string
            authors:
                description: "Author(s)"
                required: false
                type: string
            repository:
                description: "Repository URL"
                required: false
                type: string
            website:
                description: "Website URL"
                required: false
                type: string
            minAPI:
                description: "Minimum API version supported (e.g. 1.0)"
                required: false
                type: string

jobs:
    convert:
        runs-on: ubuntu-latest
        permissions: write-all
        env:
            SUPPORTED_ICON_FORMATS: "png|jpg|jpeg|svg"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Extract tool info
              id: tool
              env:
                  TOOL_PACKAGE: ${{ inputs.npm_package_name }}
                  TOOL_NAME: ${{ inputs.display_name }}
                  TOOL_DESCRIPTION: ${{ inputs.description }}
                  TOOL_AUTHORS: ${{ inputs.authors }}
                  TOOL_README_URL: ${{ inputs.readme_url }}
                  TOOL_ICON: ${{ inputs.icon }}
                  TOOL_REPOSITORY: ${{ inputs.repository }}
                  TOOL_WEBSITE: ${{ inputs.website }}
                  TOOL_MIN_API: ${{ inputs.minAPI }}
              run: |
                  node <<'NODE'
                  const { appendFileSync } = require('node:fs');
                  const { randomUUID } = require('node:crypto');
                  const fields = {
                    package: 'TOOL_PACKAGE',
                    name: 'TOOL_NAME',
                    description: 'TOOL_DESCRIPTION',
                    authors: 'TOOL_AUTHORS',
                    readme_url: 'TOOL_README_URL',
                    icon: 'TOOL_ICON',
                    repository: 'TOOL_REPOSITORY',
                    website: 'TOOL_WEBSITE',
                    minAPI: 'TOOL_MIN_API',
                  };
                  for (const [output, variable] of Object.entries(fields)) {
                    const delimiter = randomUUID();
                    appendFileSync(process.env.GITHUB_OUTPUT,
                      `${output}<<${delimiter}\n${process.env[variable] || ''}\n${delimiter}\n`);
                  }
                  NODE

            - name: Check approved intake
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  TOOL_INTAKE_ID: ${{ inputs.intake_id }}
                  TOOL_INTAKE_REVISION: ${{ inputs.intake_revision }}
                  TOOL_PACKAGENAME: ${{ inputs.npm_package_name }}
                  TOOL_VERSION: ${{ inputs.version }}
              run: node buildScripts/publishToolRelease.js --check-intake

            - name: Download approved npm version and verify manifest
              id: build
              env:
                  TOOL_PACKAGE: ${{ inputs.npm_package_name }}
                  APPROVED_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  npm pack --ignore-scripts -- "${TOOL_PACKAGE}@${APPROVED_VERSION}"
            
                  # Extract
                  tar -xzf *.tgz
                  cd package
            
                  node <<'NODE'
                  const manifest = JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));
                  if (manifest.name !== process.env.TOOL_PACKAGE || manifest.version !== process.env.APPROVED_VERSION) {
                    throw new Error("Downloaded manifest does not match the approved npm package and version");
                  }
                  NODE
                  echo "version=$APPROVED_VERSION" >> "$GITHUB_OUTPUT"
            
                  # Install production dependencies (skip lifecycle scripts to avoid husky issues)
                  npm install --omit=dev --omit=optional --ignore-scripts --legacy-peer-deps
            
                  # Run build if script exists
                  npm run --if-present build || echo "No build script found or build failed"
            
                  # Create tool ID (kebab-case)
                  TOOL_ID=$(printf '%s' "$TOOL_PACKAGE" | sed 's/@//g; s/\//-/g')
                  echo "id=$TOOL_ID" >> $GITHUB_OUTPUT
            
                  cd ..

            - name: Set tool environment
              run: |
                  echo "TOOL_ID=${{ steps.build.outputs.id }}" >> $GITHUB_ENV
                  echo "TOOL_VERSION=${{ steps.build.outputs.version }}" >> $GITHUB_ENV

            - name: Create distribution archive
              run: |
                  cd package

                  # Remove unnecessary files
                  rm -rf .git .github node_modules/*/test node_modules/*/tests
                  rm -rf node_modules/*/*.md node_modules/*/.npmignore
                  find . -name "*.map" -delete
                  find . -name "*.ts" ! -name "*.d.ts" -delete

                  # Create archive
                  tar -czf ../${{ steps.build.outputs.id }}-${{ steps.build.outputs.version }}.tar.gz \
                    --exclude=node_modules/.bin \
                    package.json \
                    dist/

                  cd ..

            - name: Generate checksum
              id: checksum
              run: |
                  CHECKSUM=$(sha256sum ${{ steps.build.outputs.id }}-${{ steps.build.outputs.version }}.tar.gz | awk '{print $1}')
                  SIZE=$(stat -f%z ${{ steps.build.outputs.id }}-${{ steps.build.outputs.version }}.tar.gz 2>/dev/null || stat -c%s ${{ steps.build.outputs.id }}-${{ steps.build.outputs.version }}.tar.gz)

                  echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
                  echo "size=$SIZE" >> $GITHUB_OUTPUT

            - name: Extract or download icon
              id: icon
              if: ${{ steps.tool.outputs.icon != '' }}
              run: |
                  ICON="${{ steps.tool.outputs.icon }}"

                  if [ -n "$ICON" ]; then
                    echo "Using bundled icon: $ICON"
                    
                    # Check if icon exists in package/dist
                    if [ -f "package/dist/$ICON" ]; then
                      # Extract extension
                      EXTENSION="${ICON##*.}"
                      EXTENSION=$(echo "$EXTENSION" | tr '[:upper:]' '[:lower:]')
                      
                      # Copy icon to release directory
                      ICON_FILENAME="${{ steps.build.outputs.id }}-${{ steps.build.outputs.version }}-icon.${EXTENSION}"
                      cp "package/dist/$ICON" "$ICON_FILENAME"
                      
                      echo "✅ Bundled icon extracted successfully"
                      echo "filename=$ICON_FILENAME" >> $GITHUB_OUTPUT
                      echo "has_icon=true" >> $GITHUB_OUTPUT
                      echo "icon_path=$ICON" >> $GITHUB_OUTPUT
                    else
                      echo "⚠️ Bundled icon not found at package/dist/$ICON"
                      echo "has_icon=false" >> $GITHUB_OUTPUT
                    fi
                  fi

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Upload tool package and icon to Azure Blob
              run: |
                  set -euo pipefail

                  FOLDER="${TOOL_ID}-${TOOL_VERSION}"

                  az storage blob upload \
                    --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
                    --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
                    --name "packages/${FOLDER}/${FOLDER}.tar.gz" \
                    --file "${FOLDER}.tar.gz" \
                    --auth-mode login \
                    --overwrite true

                  if [ "${{ steps.icon.outputs.has_icon }}" = "true" ]; then
                    az storage blob upload \
                      --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
                      --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
                      --name "packages/${FOLDER}/${{ steps.icon.outputs.filename }}" \
                      --file "${{ steps.icon.outputs.filename }}" \
                      --auth-mode login \
                      --overwrite true
                  fi

            - name: Build tool metadata JSON
              env:
                  INPUT_PACKAGE: ${{ steps.tool.outputs.package }}
                  INPUT_NAME: ${{ steps.tool.outputs.name }}
                  INPUT_DESCRIPTION: ${{ steps.tool.outputs.description }}
                  INPUT_AUTHORS: ${{ steps.tool.outputs.authors }}
                  INPUT_README_URL: ${{ steps.tool.outputs.readme_url }}
                  INPUT_REPOSITORY: ${{ steps.tool.outputs.repository }}
                  INPUT_WEBSITE: ${{ steps.tool.outputs.website }}
                  INPUT_MIN_API: ${{ steps.tool.outputs.minAPI }}
              run: |
                  set -euo pipefail

                  FOLDER="${TOOL_ID}-${TOOL_VERSION}"
                  DOWNLOAD_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/packages/${FOLDER}/${FOLDER}.tar.gz"

                  ICON_URL=""
                  if [ "${{ steps.icon.outputs.has_icon }}" = "true" ]; then
                    ICON_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/packages/${FOLDER}/${{ steps.icon.outputs.filename }}"
                  fi

                  TOOL_METADATA_JSON=$(jq -c -n \
                    --arg tool_id "${TOOL_ID}" \
                    --arg tool_version "${TOOL_VERSION}" \
                    --arg packageName "$INPUT_PACKAGE" \
                    --arg name "$INPUT_NAME" \
                    --arg description "$INPUT_DESCRIPTION" \
                    --arg authors "$INPUT_AUTHORS" \
                    --arg readme_url "$INPUT_README_URL" \
                    --arg icon "$ICON_URL" \
                    --arg downloadurl "$DOWNLOAD_URL" \
                    --arg checksum "${{ steps.checksum.outputs.checksum }}" \
                    --arg size "${{ steps.checksum.outputs.size }}" \
                    --arg repository "$INPUT_REPOSITORY" \
                    --arg website "$INPUT_WEBSITE" \
                    --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg min_api "$INPUT_MIN_API" \
                    '{
                      tool_id: $tool_id,
                      tool_version: $tool_version,
                      packagename: $packageName,
                      name: $name,
                      description: $description,
                      authors: $authors,
                      readmeurl: $readme_url,
                      icon: (if $icon == "" then null else $icon end),
                      downloadurl: $downloadurl,
                      checksum: $checksum,
                      size: ($size | tonumber),
                      repository: (if $repository == "" then null else $repository end),
                      website: (if $website == "" then null else $website end),
                      min_api: (if $min_api == "" then null else $min_api end),
                      published_at: $published
                    }')

                  echo "TOOL_METADATA_JSON=$TOOL_METADATA_JSON" >> $GITHUB_ENV

            - name: Detect pptb.config
              id: pptb_config
              run: |
                  set -euo pipefail

                  # pptb.config.json always sits alongside package.json.
                  CONFIG_PATH="package/pptb.config.json"
                  CONFIG_JSON="null"
                  if [ -f "$CONFIG_PATH" ]; then
                    if jq -e . "$CONFIG_PATH" >/dev/null 2>&1; then
                      CONFIG_JSON=$(jq -c . "$CONFIG_PATH")
                      echo "Found pptb.config.json"
                    else
                      echo "⚠️ $CONFIG_PATH is not valid JSON; ignoring"
                    fi
                  fi

                  echo "json<<EOF" >> $GITHUB_OUTPUT
                  echo "$CONFIG_JSON" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Update Supabase database
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  INPUT_FEATURES: ${{ inputs.features }}
                  INPUT_CSP_EXCEPTIONS: ${{ inputs.csp_exceptions }}
                  PPTB_CONFIG_JSON: ${{ steps.pptb_config.outputs.json }}
                  TOOL_PACKAGENAME: ${{ steps.tool.outputs.package }}
                  TOOL_INTAKE_ID: ${{ inputs.intake_id }}
                  TOOL_INTAKE_REVISION: ${{ inputs.intake_revision }}
                  TOOL_NAME: ${{ steps.tool.outputs.name }}
                  TOOL_DESCRIPTION: ${{ steps.tool.outputs.description }}
                  TOOL_LICENSE: ${{ inputs.license }}
                  TOOL_REPOSITORY: ${{ steps.tool.outputs.repository }}
                  TOOL_WEBSITE: ${{ steps.tool.outputs.website }}
                  TOOL_MIN_API: ${{ steps.tool.outputs.minAPI }}
                  TOOL_SUBMITTED_BY: ${{ inputs.submitted_by }}
                  TOOL_READMEURL: ${{ steps.tool.outputs.readme_url }}
              run: |
                  set -euo pipefail

                  # Ensure required tools exist (exit 127 indicates command-not-found)
                  command -v curl >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y curl)
                  command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

                  FOLDER="${TOOL_ID}-${TOOL_VERSION}"

                  # Prepare icon and download URLs
                  ICON_URL=""
                  if [ "${{ steps.icon.outputs.has_icon }}" = "true" ]; then
                    ICON_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/packages/${FOLDER}/${{ steps.icon.outputs.filename }}"
                  fi

                  # Azure Blob (preferred distribution)
                  BLOB_DOWNLOAD_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/packages/${FOLDER}/${FOLDER}.tar.gz"

                  # Normalize JSON-like input safely. Accepts full JSON and also object fragments like "key":"value".
                  normalize_json_input() {
                    local raw="$1"
                    local field_name="$2"
                    local trimmed
                    local candidate

                    trimmed=$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

                    if [ -z "$trimmed" ] || [ "$trimmed" = "null" ]; then
                      echo "null"
                      return 0
                    fi

                    if printf '%s' "$trimmed" | jq -e . >/dev/null 2>&1; then
                      printf '%s' "$trimmed" | jq -c .
                      return 0
                    fi

                    # Some callers send object members without surrounding braces.
                    if [[ "$trimmed" == *:* ]] && [[ "$trimmed" != \{* ]] && [[ "$trimmed" != \[* ]]; then
                      candidate="{$trimmed}"
                      if printf '%s' "$candidate" | jq -e . >/dev/null 2>&1; then
                        printf '%s' "$candidate" | jq -c .
                        return 0
                      fi
                    fi

                    echo "Invalid JSON for ${field_name} workflow input: $trimmed" >&2
                    return 1
                  }

                  FEATURES_JSON=$(normalize_json_input "${INPUT_FEATURES}" "features")
                  CSP_JSON=$(normalize_json_input "${INPUT_CSP_EXCEPTIONS}" "csp_exceptions")

                  # Safe diagnostics (do not print raw values)
                  summarize_json_field() {
                    local field_name="$1"
                    local json_value="$2"
                    local json_type
                    local key_count
                    local key_names

                    if [ "$json_value" = "null" ]; then
                      echo "${field_name}: value is null or empty"
                      return 0
                    fi

                    json_type=$(printf '%s' "$json_value" | jq -r 'type')
                    echo "${field_name}: valid JSON (type=${json_type})"

                    if [ "$json_type" = "object" ]; then
                      key_count=$(printf '%s' "$json_value" | jq 'keys | length')
                      key_names=$(printf '%s' "$json_value" | jq -r 'keys | join(",")')
                      echo "${field_name}: object key_count=${key_count} keys=${key_names}"
                    elif [ "$json_type" = "array" ]; then
                      key_count=$(printf '%s' "$json_value" | jq 'length')
                      echo "${field_name}: array length=${key_count}"
                    fi
                  }

                  summarize_json_field "features" "$FEATURES_JSON"
                  summarize_json_field "csp_exceptions" "$CSP_JSON"

                  # Publish tool identity, release metadata and package features atomically
                  # through the restricted publish_tool_release RPC (see supabase/sql/publish_tool_release.sql).
                  TOOL_CSP_EXCEPTIONS="$CSP_JSON" \
                    TOOL_VERSION="${{ steps.build.outputs.version }}" \
                    TOOL_DOWNLOAD="$BLOB_DOWNLOAD_URL" \
                    TOOL_ICON="$ICON_URL" \
                    TOOL_CHECKSUM="${{ steps.checksum.outputs.checksum }}" \
                    TOOL_SIZE="${{ steps.checksum.outputs.size }}" \
                    TOOL_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    TOOL_FEATURES="$FEATURES_JSON" \
                    TOOL_PPTB_CONFIG="$PPTB_CONFIG_JSON" \
                    node buildScripts/publishToolRelease.js

            - name: Regenerate Azure Blob registry.json
              run: |
                  set -euo pipefail

                  az storage blob download \
                    --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
                    --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
                    --name registry.json \
                    --file registry.json \
                    --auth-mode login \
                    || echo '{"version":"1.0","tools":[]}' > registry.json

                  node buildScripts/updateRegistry.js "${TOOL_ID}" "${TOOL_VERSION}" "$TOOL_METADATA_JSON"

                  az storage blob upload \
                    --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
                    --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
                    --name registry.json \
                    --file registry.json \
                    --auth-mode login \
                    --overwrite true
